<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/fonts/pelak/pelak-font-face.css">
    <link rel="stylesheet" href="./assets/vendors/bootstrap-icons-1.11.3/font/bootstrap-icons.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <link rel="stylesheet" href="./assets/css/style.css">

</head>

<body class="light-mode text-center ">
    <header class="container-flui m-5 d-flex justify-content-between align-items-center">

        <h1 class="heading fw-bold">لیست وظایف</h1>
        <button id="theme-switcher">
            <i class="bi bi-sun"></i>

        </button>

    </header>

    <div class="add-task container">

        <div class="row g-2">
            <div class="col-12 col-md-6">
                <input type="text" class="form-control add " id="add" placeholder="افزودن وظیفه جدید...">
            </div>
            <div class="col-12 col-md-3">
                <button id="add-btn" class="head-btn w-100 fs-md-1">افزودن</button>
            </div>
            <div class="col-12 col-md-3">
                <button class="clear-all head-btn w-100 ">پاک کردن همه</button>
            </div>
        </div>

    </div>

    <main class="container">


        <ul class="todos">
            <li  class="card-body" draggable="true">
                <div>
                    <input type="checkbox" class="cb-input form-check-input" />
                
                    <span class="work">یادگیری</span>
                </div>

                <button class="clear">
                    <i class="bi bi-trash3" id="trash"></i>
                    <i class="bi bi-pen"></i>

                </button>


            </li>

           
        </ul>


    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
    </script>
    <script src="./js/script.js"></script>
    

</body>

</html>
